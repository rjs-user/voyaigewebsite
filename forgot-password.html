<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset password — VOYAIGE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/tokens.css">
</head>
<body>

  <nav id="nav" class="solid">
    <a href="/" class="nav-logo" aria-label="VOYAIGE home">
      <img src="/assets/logo-mark.png" alt="" aria-hidden="true" width="42" height="35" style="display:block;">
      <span class="nav-wordmark">VOYAIGE</span>
    </a>
    <div class="nav-right"><a href="/login" class="nav-link">Sign in</a></div>
  </nav>

  <div class="auth-shell">
    <div class="auth-panel">
      <div class="auth-header">
        <p class="eyebrow enter">Account recovery</p>
        <h1 class="display auth-title hl">Reset password.</h1>
        <p class="auth-sub enter enter-d3">Enter your email and we'll send a secure link to set a new password.</p>
      </div>

      <div id="banner" class="banner"></div>

      <form id="reset-form" novalidate>
        <label class="field">
          <span class="field-label">Email</span>
          <input class="field-input" type="email" id="email" autocomplete="email" placeholder="you@example.com" required>
          <span class="field-error" id="form-error"></span>
        </label>
        <button type="submit" class="btn-primary btn-block" id="reset-submit">Send reset link</button>
      </form>

      <p class="auth-foot"><a href="/login">Back to sign in</a></p>
    </div>
  </div>

  <script type="module">
    import { supabase } from '/js/supabase-client.js';
    import '/js/nav-scroll.js';
    import '/js/auth-atmosphere.js';

    const banner = document.getElementById('banner');
    function setBanner(msg, kind) { banner.className = `banner show banner-${kind}`; banner.textContent = msg; }

    document.getElementById('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const errEl = document.getElementById('form-error');
      const submit = document.getElementById('reset-submit');
      errEl.textContent = '';
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { errEl.textContent = 'Enter a valid email address.'; return; }

      submit.disabled = true; submit.textContent = 'Sending…';
      // Land on /reset-password — the only page that can consume the recovery
      // session and call updateUser. Keep this URL bare: Supabase matches
      // redirectTo against the project's redirect allow list.
      const { error } = await supabase.auth.resetPasswordForEmail(email, {
        redirectTo: `${location.origin}/reset-password`,
      });
      submit.disabled = false; submit.textContent = 'Send reset link';

      // Always confirm (don't reveal whether an email is registered).
      setBanner('If that email has an account, a reset link is on its way. Check your inbox.', 'success');
      document.getElementById('reset-form').reset();
      if (error) console.error('[reset]', error);
    });
  </script>

</body>
</html>
