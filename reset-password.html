<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set a new password — VOYAIGE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/tokens.css">
  <style>
    .panel { display: none; }
    .panel.active { display: block; }
    .panel-intro { text-align: center; margin-top: 0; margin-bottom: 32px; }
  </style>
</head>
<body>

  <nav id="nav" class="solid">
    <a href="/" class="nav-logo" aria-label="VOYAIGE home">
      <img src="/assets/logo-mark.png" alt="" aria-hidden="true" width="42" height="35" style="display:block;">
      <span class="nav-wordmark">VOYAIGE</span>
    </a>
    <div class="nav-right"><a href="/login" class="nav-link">Sign in</a></div>
  </nav>

  <div class="auth-shell">
    <div class="auth-panel">
      <div class="auth-header">
        <p class="eyebrow enter">Account recovery</p>
        <h1 class="display auth-title hl">Set a new password.</h1>
      </div>

      <div id="banner" class="banner" role="status"></div>

      <!-- ── Panel 1: verifying the link ─────────────────────────────────── -->
      <section class="panel active" id="panel-checking">
        <p class="auth-sub panel-intro">Checking your link…</p>
      </section>

      <!-- ── Panel 2: choose the new password ────────────────────────────── -->
      <section class="panel" id="panel-form">
        <p class="auth-sub panel-intro">Choose the password you'll use to sign in from now on.</p>
        <form id="reset-form" novalidate>
          <label class="field">
            <span class="field-label">New password</span>
            <input class="field-input" type="password" id="password" autocomplete="new-password" placeholder="At least 8 characters" required minlength="8">
          </label>
          <label class="field">
            <span class="field-label">Confirm password</span>
            <input class="field-input" type="password" id="password-confirm" autocomplete="new-password" placeholder="Type it once more" required minlength="8">
            <span class="field-error" id="form-error"></span>
          </label>
          <button type="submit" class="btn-primary btn-block" id="reset-submit">Update password</button>
        </form>
        <p class="auth-foot"><a href="/login">Back to sign in</a></p>
      </section>

      <!-- ── Panel 3: the link can't be used ─────────────────────────────── -->
      <section class="panel" id="panel-blocked">
        <p class="auth-sub panel-intro">Reset links last one hour and work once. Requesting another takes a moment.</p>
        <a class="btn-primary btn-block" href="/forgot-password">Request a new link</a>
        <p class="auth-foot"><a href="/login">Back to sign in</a></p>
      </section>

    </div>
  </div>

  <script type="module">
    import { supabase } from '/js/supabase-client.js';
    import '/js/nav-scroll.js';
    import '/js/auth-atmosphere.js';

    /* ── Constants ───────────────────────────────────────────────────────── */
    const MIN_PASSWORD_LENGTH = 8;
    const LOGIN_AFTER_RESET = '/login?reset=success';
    const LINK_DEAD =
      "That reset link has expired or has already been used. Request a fresh one and we'll send it straight over.";
    // Per-tab marker so a refresh of this page — by which point supabase-js has
    // stripped the tokens out of the URL — doesn't look like a dead link.
    const RECOVERY_FLAG = 'voyaige_recovery_pending';

    /* ── Elements ────────────────────────────────────────────────────────── */
    const banner = document.getElementById('banner');
    const panels = {
      checking: document.getElementById('panel-checking'),
      form: document.getElementById('panel-form'),
      blocked: document.getElementById('panel-blocked'),
    };
    const passwordEl = document.getElementById('password');
    const confirmEl = document.getElementById('password-confirm');
    const errEl = document.getElementById('form-error');
    const submit = document.getElementById('reset-submit');

    function show(name) {
      Object.entries(panels).forEach(([key, el]) => el.classList.toggle('active', key === name));
    }
    function setBanner(msg, kind = 'error') {
      banner.className = `banner show banner-${kind}`;
      banner.textContent = msg;
    }
    function clearBanner() { banner.className = 'banner'; banner.textContent = ''; }

    /* sessionStorage throws in some privacy modes — never let it break the page. */
    function rememberRecovery() { try { sessionStorage.setItem(RECOVERY_FLAG, '1'); } catch { /* ignore */ } }
    function forgetRecovery() { try { sessionStorage.removeItem(RECOVERY_FLAG); } catch { /* ignore */ } }
    function recoveryRemembered() {
      try { return sessionStorage.getItem(RECOVERY_FLAG) === '1'; } catch { return false; }
    }

    /* ── The link ────────────────────────────────────────────────────────── */
    // Read the link's parameters BEFORE supabase-js consumes them: on a good
    // implicit callback GoTrueClient clears window.location.hash, and on a PKCE
    // callback it deletes ?code=. Both happen after this module's first await,
    // so this synchronous read always sees the URL the email sent us to.
    const linkParams = readLinkParams();

    function readLinkParams() {
      const out = {};
      try {
        const hash = location.hash.startsWith('#') ? location.hash.slice(1) : '';
        new URLSearchParams(hash).forEach((value, key) => { out[key] = value; });
        // Query wins over hash, matching supabase-js's own parseParametersFromURL.
        new URLSearchParams(location.search).forEach((value, key) => { out[key] = value; });
      } catch (err) {
        console.error('[reset-password] could not parse the link parameters', err);
      }
      return out;
    }

    function linkErrorMessage() {
      const code = `${linkParams.error_code || linkParams.error || ''}`.toLowerCase();
      if (code.includes('expired')) {
        return "That reset link has expired. Reset links last one hour — request a fresh one and we'll send it straight over.";
      }
      if (code.includes('access_denied')) {
        return "That reset link has already been used, or a newer one replaced it. Request a fresh one and we'll send it straight over.";
      }
      // error_description is attacker-controllable text sitting in the URL, so
      // it is logged for us and never rendered to the user.
      return LINK_DEAD;
    }

    /* ── Gating ──────────────────────────────────────────────────────────── */
    let isFormUnlocked = false;

    function unlockForm() {
      if (isFormUnlocked) return;
      isFormUnlocked = true;
      rememberRecovery();
      clearBanner();
      show('form');
      passwordEl.focus();
    }

    function blockWith(message) {
      forgetRecovery();
      setBanner(message, 'error');
      show('blocked');
    }

    // supabase-js emits PASSWORD_RECOVERY once it has swapped the link's tokens
    // for a session (auth-js 2.112.x: GoTrueClient._initialize notifies with the
    // 'recovery' redirect type). Registered before any await so it can't be missed.
    supabase.auth.onAuthStateChange((event, session) => {
      if (session && (event === 'PASSWORD_RECOVERY' || event === 'SIGNED_IN')) unlockForm();
    });

    async function start() {
      // 1. Supabase bounced the link straight back with an error.
      if (linkParams.error || linkParams.error_code || linkParams.error_description) {
        console.error('[reset-password] recovery link rejected',
          linkParams.error_code || linkParams.error, linkParams.error_description);
        blockWith(linkErrorMessage());
        return;
      }

      // 2. token_hash links (the {{ .TokenHash }} email template) are not picked
      //    up by detectSessionInUrl, so they have to be verified explicitly.
      if (linkParams.token_hash && !linkParams.access_token && !linkParams.code) {
        const { error } = await supabase.auth.verifyOtp({
          token_hash: linkParams.token_hash,
          type: 'recovery',
        });
        if (error) {
          console.error('[reset-password] verifyOtp failed', error);
          blockWith(LINK_DEAD);
          return;
        }
        unlockForm();
        return;
      }

      // 3. Nothing here looks like a recovery link, and no reset is part-way
      //    through in this tab. Don't offer a password change off a stray session.
      const looksLikeRecovery = Boolean(
        linkParams.access_token || linkParams.code || linkParams.type === 'recovery',
      );
      if (!looksLikeRecovery && !recoveryRemembered()) {
        blockWith("This page finishes a password reset. Request a link and we'll email you one.");
        return;
      }

      // 4. Implicit (#access_token…) and PKCE (?code=) links are exchanged by the
      //    client itself. getSession() waits on that initialisation, so a session
      //    here means the link was good — even if the event beat us to it.
      const { data: { session }, error } = await supabase.auth.getSession();
      if (error) console.error('[reset-password] getSession failed', error);
      if (session) { unlockForm(); return; }
      blockWith(LINK_DEAD);
    }

    /* ── Setting the password ────────────────────────────────────────────── */
    function handleUpdateError(error) {
      const code = `${error.code || ''}`.toLowerCase();
      const message = `${error.message || ''}`;

      if (code === 'same_password' || /different from the old password/i.test(message)) {
        errEl.textContent = "Choose a password you haven't used here before.";
        return;
      }
      if (code === 'weak_password' || /weak password|password should be at least/i.test(message)) {
        errEl.textContent = `That password is too easy to guess. Use at least ${MIN_PASSWORD_LENGTH} characters and something you haven't used elsewhere.`;
        return;
      }
      if (error.name === 'AuthSessionMissingError' || code === 'session_not_found' || error.status === 401) {
        blockWith("Your reset link ran out before you finished. Request a fresh one and we'll send it straight over.");
        return;
      }
      if (error.status === 429 || code === 'over_request_rate_limit') {
        setBanner('Too many attempts just now. Wait a moment, then try again.', 'warning');
        return;
      }
      setBanner("We couldn't update your password just now. Try again, or request a fresh link.", 'error');
    }

    document.getElementById('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = passwordEl.value;
      const confirmation = confirmEl.value;
      errEl.textContent = '';
      clearBanner();

      if (password.length < MIN_PASSWORD_LENGTH) {
        errEl.textContent = `Password must be at least ${MIN_PASSWORD_LENGTH} characters.`;
        return;
      }
      if (password !== confirmation) {
        errEl.textContent = "Those two passwords don't match.";
        return;
      }

      submit.disabled = true; submit.textContent = 'Updating…';
      const { error } = await supabase.auth.updateUser({ password });
      submit.disabled = false; submit.textContent = 'Update password';

      if (error) {
        console.error('[reset-password] updateUser failed', error);
        handleUpdateError(error);
        return;
      }

      // End the recovery session: the new password is what signs them in from
      // here, and /login would otherwise skip straight past the confirmation.
      // If sign-out fails the reset still succeeded — go to /login regardless.
      try {
        const { error: signOutError } = await supabase.auth.signOut();
        if (signOutError) console.error('[reset-password] sign-out after reset failed', signOutError);
      } catch (err) {
        console.error('[reset-password] sign-out after reset threw', err);
      }
      forgetRecovery();
      window.location.replace(LOGIN_AFTER_RESET);
    });

    start();
  </script>

</body>
</html>
