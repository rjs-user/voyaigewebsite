<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — VOYAIGE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/tokens.css">
</head>
<body>

  <nav id="nav" class="solid">
    <a href="/" class="nav-logo" aria-label="VOYAIGE home">
      <img src="/assets/logo-mark.png" alt="" aria-hidden="true" width="42" height="35" style="display:block;">
      <span class="nav-wordmark">VOYAIGE</span>
    </a>
    <div class="nav-right">
      <!-- /signup is NOT deployed (checkout needs Stripe) — a nav CTA to a 404
           is worse than no CTA. Restore with the checkout half. -->
      <a href="/" class="nav-cta">Early access</a>
    </div>
  </nav>

  <div class="auth-shell">
    <div class="auth-panel">
      <div class="auth-header">
        <p class="eyebrow enter">Welcome back</p>
        <h1 class="display auth-title hl">Sign in.</h1>
      </div>

      <div id="banner" class="banner"></div>

      <div class="oauth-row">
        <button class="oauth-btn" id="apple-btn">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.36 12.78c.02 2.32 2.04 3.09 2.06 3.1-.02.05-.32 1.11-1.06 2.2-.64.95-1.3 1.9-2.35 1.92-1.02.02-1.35-.6-2.52-.6-1.17 0-1.54.58-2.5.62-1 .04-1.77-1.02-2.42-1.97-1.32-1.92-2.33-5.42-.97-7.78.67-1.17 1.88-1.91 3.18-1.93.99-.02 1.93.67 2.53.67.6 0 1.74-.83 2.94-.71.5.02 1.9.2 2.8 1.53-.07.05-1.67.98-1.66 2.92M14.6 6.04c.53-.64.89-1.53.79-2.42-.76.03-1.69.51-2.24 1.15-.49.56-.92 1.47-.81 2.33.85.07 1.72-.43 2.26-1.06"/></svg>
          Continue with Apple
        </button>
        <button class="oauth-btn" id="google-btn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.99.66-2.26 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.84 14.1a6.6 6.6 0 0 1 0-4.2V7.06H2.18a11 11 0 0 0 0 9.88l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84C6.71 7.31 9.14 5.38 12 5.38z"/></svg>
          Continue with Google
        </button>
      </div>

      <div class="divider-or">or</div>

      <form id="login-form" novalidate>
        <label class="field">
          <span class="field-label">Email</span>
          <input class="field-input" type="email" id="email" autocomplete="email" placeholder="you@example.com" required>
        </label>
        <label class="field">
          <span class="field-label">Password</span>
          <input class="field-input" type="password" id="password" autocomplete="current-password" placeholder="Your password" required>
          <span class="field-error" id="form-error"></span>
        </label>
        <button type="submit" class="btn-primary btn-block" id="login-submit">Sign in</button>
      </form>

      <p class="auth-foot"><a href="/forgot-password" id="forgot-link">Forgot your password?</a></p>
      <!-- Same reason. Access is waitlist-gated at / until checkout ships. -->
      <p class="auth-foot">New to VoyAIge? <a href="/">Request early access</a></p>
    </div>
  </div>

  <script type="module">
    import { supabase } from '/js/supabase-client.js';
    import { safeReturnTo, POST_AUTH_DEFAULT } from '/js/auth-guard.js';
    import '/js/nav-scroll.js';
    import '/js/auth-atmosphere.js';

    const params = new URLSearchParams(location.search);
    const returnTo = safeReturnTo(params.get('return_to'), POST_AUTH_DEFAULT);
    const banner = document.getElementById('banner');

    function setBanner(msg, kind) { banner.className = `banner show banner-${kind}`; banner.textContent = msg; }

    // Arrived from /reset-password after a successful password change.
    if (params.get('reset') === 'success') {
      setBanner('Password updated. Sign in with your new password.', 'success');
    }

    // Already signed in? Skip straight to the destination.
    (async () => {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) window.location.replace(returnTo);
    })();

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errEl = document.getElementById('form-error');
      const submit = document.getElementById('login-submit');
      errEl.textContent = '';
      submit.disabled = true; submit.textContent = 'Signing in…';

      const { error } = await supabase.auth.signInWithPassword({ email, password });
      submit.disabled = false; submit.textContent = 'Sign in';

      if (error) {
        errEl.textContent = /invalid login/i.test(error.message)
          ? 'Email or password is incorrect.' : error.message;
        return;
      }
      window.location.replace(returnTo);
    });

    function oauth(provider) {
      supabase.auth.signInWithOAuth({
        provider,
        options: { redirectTo: `${location.origin}${returnTo}` },
      });
    }
    document.getElementById('apple-btn').onclick = () => oauth('apple');
    document.getElementById('google-btn').onclick = () => oauth('google');

    // Carry return_to into the reset flow.
    document.getElementById('forgot-link').href =
      `/forgot-password${returnTo !== POST_AUTH_DEFAULT ? `?return_to=${encodeURIComponent(returnTo)}` : ''}`;
  </script>

</body>
</html>
